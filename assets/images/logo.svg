<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 64" fill="none">
  <defs>
    <!-- Vibrant & Friendly Brand Gradients -->
    <linearGradient id="scGradPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#F43F5E"/>
    </linearGradient>

    <linearGradient id="scGradSecondary" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="60%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>

    <!-- Soft Ambient Glow -->
    <filter id="cuteGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- ── Cute & Professional 'SC' Monogram Emblem ── -->
  <g transform="translate(6, 6)">
    <!-- Rounded Pebble Background -->
    <rect x="0" y="0" width="52" height="52" rx="16" fill="#0E1628" stroke="url(#scGradPrimary)" stroke-width="2"/>
    <rect x="3" y="3" width="46" height="46" rx="13" fill="#15213D" opacity="0.65"/>

    <!-- Interlocking Friendly 'S' & 'C' Ribbon -->
    <!-- 'C' Outer Curve -->
    <path d="M40 18 C36 13, 27 12, 21 16 C14 21, 14 31, 21 36 C27 40, 36 39, 40 34"
          stroke="url(#scGradSecondary)" stroke-width="3.8" stroke-linecap="round" fill="none"/>

    <!-- 'S' Fluid Inner Loop -->
    <path d="M33 19 C31 16, 26 16, 23 18 C19 20, 20 25, 27 27 C34 29, 34 34, 30 36 C26 38, 21 36, 19 33"
          stroke="url(#scGradPrimary)" stroke-width="3.6" stroke-linecap="round" fill="none"/>

    <!-- Cute Sparkle Accent Dot -->
    <circle cx="39" cy="18" r="2.8" fill="#F43F5E" filter="url(#cuteGlow)"/>
    <circle cx="16" cy="33" r="2.2" fill="#34D399"/>
  </g>

  <!-- ── Brand Typography ── -->
  <!-- SURAJ Text -->
  <text x="68" y="34" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="22" letter-spacing="0.04em" fill="#FFFFFF">
    SURAJ
  </text>

  <!-- Cute .ORG Capsule Badge -->
  <g transform="translate(158, 17)">
    <rect x="0" y="0" width="58" height="22" rx="11" fill="rgba(56, 189, 248, 0.12)" stroke="url(#scGradPrimary)" stroke-width="1.2"/>
    <text x="29" y="15" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="11" fill="#38BDF8" letter-spacing="0.06em">
      .ORG
    </text>
  </g>

  <!-- Professional Subtitle Tagline -->
  <text x="69" y="48" font-family="'JetBrains Mono', monospace" font-weight="500" font-size="9" fill="#94A3B8" letter-spacing="0.14em">
    BA &amp; FULL-STACK TECH
  </text>
</svg>
