<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 130 48" fill="none">
  <defs>
    <!-- Clean Professional Gradient -->
    <linearGradient id="scCleanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
  </defs>

  <!-- Clean Professional SC Emblem Frame -->
  <g transform="translate(2, 2)">
    <rect width="44" height="44" rx="12" fill="#0F172A" stroke="url(#scCleanGrad)" stroke-width="1.8"/>
    
    <!-- Minimalist Precision 'S' & 'C' Monogram -->
    <!-- 'C' Outer Arc -->
    <path d="M34 16 C31 12, 23 12, 18 16 C12 21, 12 27, 18 32 C23 36, 31 36, 34 32" 
          stroke="#38BDF8" stroke-width="3" stroke-linecap="round" fill="none"/>
    
    <!-- 'S' Inner Flow -->
    <path d="M28 17 C26 15, 22 15, 20 17 C17 19, 18 22, 24 24 C29 25, 29 29, 26 31 C23 33, 19 32, 17 29" 
          stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Plain Professional 'SC' Typography (No .org, completely clean) -->
  <text x="56" y="32" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="24" letter-spacing="0.08em" fill="#FFFFFF">
    SC
  </text>
</svg>
