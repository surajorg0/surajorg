<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="favGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <filter id="favGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="64" height="64" rx="16" fill="#0B132B"/>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#111C38" stroke="url(#favGrad)" stroke-width="2"/>

  <!-- Stylized Geometric S -->
  <path d="M44 22 C44 22, 40 17, 32 17 C23 17, 20 22, 20 26 C20 33, 44 31, 44 40 C44 47, 39 49, 32 49 C23 49, 19 44, 19 44"
        stroke="url(#favGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Energy nodes -->
  <circle cx="32" cy="33" r="3.5" fill="#38BDF8" filter="url(#favGlow)"/>
  <circle cx="22" cy="20" r="2.5" fill="#10B981"/>
  <circle cx="42" cy="46" r="2.5" fill="#3B82F6"/>
</svg>
